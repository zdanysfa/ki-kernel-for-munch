name: Build release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      target_os:
        type: choice
        options: [miui, aosp, coloros, both]
        default: miui

permissions:
  contents: read

jobs:
  check-version:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # Fails before hours of compiling rather than after.
      - name: Tag matches build.sh
        if: startsWith(github.ref, 'refs/tags/')
        run: grep -qxF "KERNEL_VERSION=\"$GITHUB_REF_NAME\"" build.sh

  build:
    needs: check-version
    uses: ./.github/workflows/_build.yml
    with:
      target_os: ${{ inputs.target_os || 'miui' }}
      profile: release

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ki-kernel-${{ inputs.target_os || 'miui' }}-release
      # Draft: CI cannot boot the kernel, so a person publishes after testing on the phone.
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" --draft --verify-tag --generate-notes ./*.zip SHA256SUMS
